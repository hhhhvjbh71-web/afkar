  <!-- ═══════════════════════════════════════════════════════════
         شاشة التحميل — الخلية | أ/ إسلام عبدالواحد
         "Cell Formation" Loading Screen — Ivory / Emerald / Teal / Gold
         Rebuilt from scratch for the new visual identity
         ═══════════════════════════════════════════════════════════ -->
  <style>
    #iraqi-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 36%, #FFFDF6 0%, #FAF7EE 45%, #F1F7F0 100%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #iraqi-loader.ld-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    [data-theme="dark"] #iraqi-loader {
      background: radial-gradient(circle at 50% 36%, #0F2B1E 0%, #07130D 55%, #03130C 100%);
    }

    /* Molecules drifting inward and dissolving into the forming membrane */
    .cl-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .cl-mote {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 3px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #34D399, #14B8A6);
      opacity: 0;
      animation: clMoteDrift 5.5s ease-in infinite;
    }

    .cl-mote.cl-gold {
      background: linear-gradient(135deg, #E8C766, #C9962C);
    }

    [data-theme="dark"] .cl-mote {
      background: linear-gradient(135deg, #34D399, #2DD4BF);
    }

    .cl-m1 {
      left: 14%;
      top: 20%;
      --tx: 210px;
      --ty: 110px;
      animation-delay: 0s;
    }

    .cl-m2 {
      right: 12%;
      top: 16%;
      --tx: -190px;
      --ty: 130px;
      animation-delay: 1.1s;
    }

    .cl-m3 {
      right: 8%;
      bottom: 22%;
      --tx: -170px;
      --ty: -110px;
      animation-delay: 2.3s;
    }

    .cl-m4 {
      left: 10%;
      bottom: 18%;
      --tx: 190px;
      --ty: -100px;
      animation-delay: 3.4s;
    }

    .cl-m5 {
      left: 48%;
      top: 8%;
      --tx: 6px;
      --ty: 160px;
      animation-delay: 1.7s;
    }

    .cl-m6 {
      right: 42%;
      bottom: 10%;
      --tx: -4px;
      --ty: -150px;
      animation-delay: 4s;
    }

    @keyframes clMoteDrift {
      0% {
        transform: translate(var(--tx), var(--ty)) rotate(45deg) scale(1);
        opacity: 0;
      }

      12% {
        opacity: 0.9;
      }

      75% {
        opacity: 0.55;
      }

      100% {
        transform: translate(0, 0) rotate(45deg) scale(0.4);
        opacity: 0;
      }
    }

    /* Core: cell membrane forming, organelles orbiting the nucleus */
    .cl-cell {
      position: relative;
      width: 156px;
      height: 156px;
    }

    .cl-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .cl-membrane {
      stroke-dasharray: 390;
      stroke-dashoffset: 390;
      filter: drop-shadow(0 0 8px rgba(20, 184, 166, 0.35));
      animation: clMembraneDraw 1.9s cubic-bezier(.4, 0, .2, 1) forwards;
    }

    @keyframes clMembraneDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .cl-membrane-fill {
      animation: clFillIn 1.2s ease-out 1.1s both;
    }

    @keyframes clFillIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .cl-organelles {
      transform-origin: 80px 80px;
      animation: clOrbit 10s linear infinite, clFillIn 0.8s ease-out 1.6s both;
    }

    @keyframes clOrbit {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .cl-organelle {
      transform-origin: center;
      animation: clOrgSpin 10s linear infinite reverse;
    }

    @keyframes clOrgSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .cl-nucleus {
      transform-origin: 80px 82px;
      animation: clFillIn 0.7s ease-out 1.3s both, clNucleusPulse 2.6s ease-in-out 2s infinite;
    }

    @keyframes clNucleusPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    .cl-nucleolus {
      transform-origin: 80px 82px;
      animation: clFillIn 0.6s ease-out 1.7s both, clNucleolusGlow 2.6s ease-in-out 2s infinite;
    }

    @keyframes clNucleolusGlow {

      0%,
      100% {
        opacity: 0.85;
      }

      50% {
        opacity: 1;
        filter: drop-shadow(0 0 5px rgba(232, 199, 102, 0.8));
      }
    }

    /* Brand */
    .ld-brand {
      text-align: center;
    }

    .ld-brand-name {
      margin: 0;
      font-family: 'Tajawal', 'Inter', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: 0.01em;
      background: linear-gradient(135deg, #047857 0%, #14B8A6 55%, #C9962C 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: ldFadeUp 0.7s ease both;
    }

    .ld-brand-sub {
      margin: 6px 0 0;
      font-family: 'Tajawal', 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #3F5F4E;
      animation: ldFadeUp 0.7s ease 0.15s both;
    }

    [data-theme="dark"] .ld-brand-sub {
      color: #7FAE8E;
    }

    @keyframes ldFadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Progress */
    .ld-progress {
      width: 220px;
      text-align: center;
    }

    .ld-bar-track {
      width: 100%;
      height: 5px;
      border-radius: 99px;
      background: rgba(20, 184, 166, 0.14);
      overflow: hidden;
    }

    [data-theme="dark"] .ld-bar-track {
      background: rgba(45, 212, 191, 0.18);
    }

    #ld-bar-fill {
      height: 100%;
      width: 6%;
      border-radius: 99px;
      background: linear-gradient(90deg, #047857, #14B8A6, #C9962C);
      box-shadow: 0 0 10px rgba(20, 184, 166, 0.55);
      transition: width 0.6s cubic-bezier(.4, 0, .2, 1);
    }

    #ld-msg {
      margin: 12px 0 0;
      font-family: 'Tajawal', 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #71887C;
      min-height: 1.2em;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #ld-msg.ld-msg-in {
      opacity: 1;
      transform: translateY(0);
    }

    [data-theme="dark"] #ld-msg {
      color: #7FAE8E;
    }

    @media (max-width: 420px) {
      .cl-cell {
        width: 128px;
        height: 128px;
      }

      .ld-brand-name {
        font-size: 1.7rem;
      }

      .ld-progress {
        width: 180px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .cl-mote,
      .cl-organelles,
      .cl-organelle,
      .cl-nucleus,
      .cl-nucleolus,
      .ld-brand-name,
      .ld-brand-sub {
        animation: none !important;
      }

      .cl-membrane {
        stroke-dashoffset: 0;
      }

      .cl-membrane-fill,
      .cl-organelles,
      .cl-nucleus,
      .cl-nucleolus {
        opacity: 1;
      }
    }
  </style>
</head>

  <div id="dashPwOverlay" onclick="if(event.target===this)closeDashModal()">
    <div id="dashPwModal">
      <div class="pw-icon">🔐</div>
      <h3>Platform Control Panel</h3>

        onkeydown="if(event.key==='Enter')verifyDashPw()">
      <div id="dashPwErr">❌ Incorrect password. Please try again.</div>

  <!-- ═══════════════ منطق اللودينج ═══════════════ -->
  <script>
    (function () {
      var loader = document.getElementById('iraqi-loader');
      var bar = document.getElementById('ld-bar-fill');
      var msg = document.getElementById('ld-msg');
      if (!loader) return;

      var msgs = [
        'نجهّز عالم الأحياء…',
        'نستكشف الخلية…',
        'نرتّب المفاهيم…',
        'نجهّز الدروس…',
        'كل شيء جاهز.'
      ];
      var pcts = [15, 32, 54, 76, 95];
      var i = 0;

      function step(crossfade) {
        if (i >= msgs.length) return;
        if (bar) bar.style.width = pcts[i] + '%';
        if (msg) {
          if (crossfade) {
            msg.classList.remove('ld-msg-in');
            (function (text) {
              setTimeout(function () {
                msg.textContent = text;
                msg.classList.add('ld-msg-in');
              }, 200);
            })(msgs[i]);
          } else {
            msg.textContent = msgs[i];
          }
        }
        i++;
      }

      step(false);
      setTimeout(function () { if (msg) msg.classList.add('ld-msg-in'); }, 700);
      var t1 = setTimeout(function () { step(true); }, 900);
      var t2 = setTimeout(function () { step(true); }, 2300);
      var t3 = setTimeout(function () { step(true); }, 3800);
      var t4 = setTimeout(function () { step(true); }, 5100);

      function hide() {
        if (!loader || !loader.parentNode) return;
        if (bar) bar.style.width = '100%';
        setTimeout(function () {
          loader.classList.add('ld-hide');
          if (typeof window.startHeroTypewriter === 'function') {
            setTimeout(window.startHeroTypewriter, 300);
          }
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 900);
        }, 300);
      }

      var minAt = Date.now() + 6300;
      function tryHide() {
        var delay = Math.max(0, minAt - Date.now());
        setTimeout(hide, delay);
      }

      if (document.readyState === 'complete') {
        tryHide();
      } else {
        window.addEventListener('load', tryHide);
      }

      setTimeout(function () {
        if (loader && loader.parentNode) hide();
      }, 13000);
    })();
  </script>

  <script>
    (function () {
      var _H = 'b8e9680e7741d4c20577be2e153e7eb8863f6831d1d86689d0234c0628ec2c4b';
      var FILE = 'dashboard.html';

      async function _digest(s) {
        try {
          var buf = new TextEncoder().encode(s);
          var hashBuf = await crypto.subtle.digest('SHA-256', buf);
          return Array.from(new Uint8Array(hashBuf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        } catch (e) {
          return btoa(s);
        }
      }

      window.openDashModal = function () {
        var ov = document.getElementById('dashPwOverlay'), inp = document.getElementById('dashPwInput'), err = document.getElementById('dashPwErr');
        if (!ov) return; ov.classList.add('open');
        if (err) err.style.display = 'none';
        if (inp) { inp.value = ''; setTimeout(function () { inp.focus(); }, 120); }
      };
      window.closeDashModal = function () { var ov = document.getElementById('dashPwOverlay'); if (ov) ov.classList.remove('open'); };
      window.verifyDashPw = async function () {
        var inp = document.getElementById('dashPwInput'), err = document.getElementById('dashPwErr'), modal = document.getElementById('dashPwModal');
        var pw = inp ? inp.value.trim() : '';
        var h = await _digest(pw);
        if (h === _H || pw === atob('MjAyMDIw') || pw === '202020') {
          if (err) err.style.display = 'none';
          localStorage.setItem('alsaqr_current_user', JSON.stringify({
            id: 'admin_dashboard', name: 'أ/ إسلام عبدالواحد', role: 'admin',
            email: 'admin@iraqi.com', loginAt: new Date().toISOString()
          }));
          closeDashModal();
          // الانتقال المباشر للوحة التحكم لحل مشكلة Popup Blocker على الهواتف
          window.location.href = FILE;
        } else {
          if (err) err.style.display = 'block';
          if (modal) { modal.classList.remove('pw-shake'); void modal.offsetWidth; modal.classList.add('pw-shake'); }
          if (inp) { inp.value = ''; inp.focus(); }
        }
      };
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDashModal(); });
    })();
  </script>
